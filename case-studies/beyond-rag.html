        "articleBody": "The problem. An organisation's specialised material — regulations, procedures, technical standards, accumulated case history — is dense and interconnected. The questions people actually ask about it are rarely lookups. They sound more like: does this case fall under the exception, and if it does, what else changes as a result? That is a question about how several parts of the material relate to each other. The default answer is a local RAG: chunk the documents, embed them, retrieve the top-k nearest passages, hand them to a model. For lookups that works well and it is the right tool. For this it leaks in three places at once, and none of them are tuning problems. The chunk boundary cuts through the structure the answer depends on — which section governs which, what supersedes what, which exception was added later. The size of k has to be guessed: too small and the answer is not in the window, too large and it is buried under near-misses that scored well and mean nothing. And when an answer does come back, there is nothing to open. A vector neighbourhood is not something a person can inspect and disagree with. That last one is the disqualifying one. In a regulated setting, an answer nobody can trace is not an answer — it is a suggestion with good grammar.\n\nThe approach. Change the substrate rather than the tuning. The corpus is plain markdown, and the directory layout belongs to the people who own the domain: they decide what sits where, because they are the ones who know which distinctions matter. New material triggers a re-index as it arrives, so freshness is not a separate job that someone forgets to run. Retrieval is full-text search across those files and the relations the structure expresses — closer in spirit to a graph RAG than to a vector one, except the graph is a directory tree and a set of documents, which is to say it is legible. There is no k to choose and no chunk boundary to tune. The agent decides what to consult, reads it with its structure intact, and reasons across the parts before answering. Because an answer arrives with the path it came from, verification is opening the file. That is the whole design; everything else follows from wanting that property. Capability is extended the same way: rather than writing code or wiring an n8n flow for each new task, you ask the agent to build a skill, so the people closest to the work add to the system without a release cycle standing between them and it.\n\nThe two substrates. A vector RAG runs documents, chunk and embed, vector store, top-k by similarity, answer — losing the structure at the chunk boundary, guessing at k, and arriving with no path back. The alternative runs new material, re-index on arrival, a markdown corpus in directories the domain owner lays out, full-text search across files and their relations, then an answer plus its source path — and a person opens that file and checks the answer against it. No k to choose, no chunk boundary to tune, and retrieval noise becomes a structure problem fixed by moving a file rather than by hoping the next reranker behaves. Everything runs against models hosted where the material already is, so nothing leaves the organisation.\n\nThe result. Questions that require analysis come back with an answer and the reasoning behind it, instead of a list of excerpts for the reader to synthesise — and every answer can be walked back to the file it came from. Retrieval noise stops being a tuning problem and becomes a structure problem, which is a much better kind of problem.\n\nThe decision that mattered. Choosing a substrate a human can audit, and accepting the cost of that choice. Vector search is genuinely better at finding text that resembles a query, and giving it up meant giving up something real. What made it worth it: retrieval quality was never the bottleneck. Better embeddings, better chunking, better reranking all improve how well the system finds passages that look like the question. None of them change the fact that looking like the question and answering it are two different things — and none of them give the person holding the answer anything to open.",
